name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Add Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'
          feature = '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', permission + feature + '    <application', 1)
              p.write_text(s)
          PY
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SenasAVoz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

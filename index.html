<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Señas a Voz LSA</title><style>body{font-family:system-ui;background:#f1f5f9;color:#0f172a;margin:0}header{background:#075985;color:white;padding:12px;text-align:center}main{padding:10px;max-width:700px;margin:auto}.card{background:white;border-radius:12px;padding:12px;margin:10px 0}button{background:#075985;color:white;border:0;border-radius:9px;padding:12px;margin:4px}textarea{width:95%;font-size:18px;padding:10px}#large{font-size:26px;text-align:center;min-height:50px}</style></head><body><header><h1>Señas a Voz LSA</h1><p>Comunicación accesible</p></header><main><div class="card"><h2>Cámara</h2><p id="cameraStatus">Cámara apagada</p><button id="cam">Iniciar cámara</button><button id="stop">Detener</button><button id="flip">Cambiar cámara</button></div><div class="card"><h2>Detector experimental de movimiento</h2><p id="motionStatus">Apagado</p><p>Movimiento: <b id="motionScore">0</b></p><p>Eventos: <b id="motionCount">0</b></p><p id="motionHint">Detecta cambios de imagen, no reconoce señas ni palabras LSA.</p></div><div class="card"><h2>Texto a voz</h2><textarea id="txt" rows="3" placeholder="Escribí un mensaje"></textarea><br><button id="show">Mostrar texto</button><button id="speak">Hablar</button><div id="large"></div></div><div class="card"><h2>Frases rápidas</h2><div id="phrases"></div></div><p>La traducción real y el avatar LSA aún no están integrados.</p></main><script type="module" src="/src/main.js"></script></body></html>
